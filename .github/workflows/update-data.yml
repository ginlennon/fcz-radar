name: update-data
# Refreshes data/*.json from public sources. Uses only the built-in GITHUB_TOKEN — no secrets.
on:
  schedule:
    - cron: "17 * * * *"      # hourly: forum index, FotMob, dbFCZ home page
    - cron: "41 */6 * * *"    # every 6h: + current dbFCZ seasons
    - cron: "23 3 * * 1"      # weekly (Mon 03:23 UTC): full dbFCZ re-crawl
  workflow_dispatch:
    inputs:
      mode:
        description: "quick | seasons | full"
        default: "seasons"
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data
        env:
          SCHED: ${{ github.event.schedule }}
          MODE: ${{ github.event.inputs.mode }}
        run: |
          rc=0
          if [ "$SCHED" = "23 3 * * 1" ] || [ "$MODE" = "full" ]; then
            python scraper/build.py --full || rc=$?
          elif [ "$SCHED" = "41 */6 * * *" ] || [ "$MODE" = "seasons" ]; then
            python scraper/build.py || rc=$?
          else
            python scraper/build.py --only home,forum,fotmob || rc=$?
          fi
          echo "BUILD_RC=$rc" >> "$GITHUB_ENV"
      - name: Commit if changed
        run: |
          git config user.name "fcz-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase -q && git push
      - name: Fail visibly if a source broke (data that did build is already committed)
        if: env.BUILD_RC != '0'
        run: |
          echo "::error::scraper exited with $BUILD_RC — check the 'Build data' log for 'STEP ... FAILED'"
          exit 1
